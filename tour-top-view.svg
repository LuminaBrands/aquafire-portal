<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 520 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer shell (top-down rectangle, long side = width) -->
  <rect x="10" y="20" width="500" height="150" rx="3" fill="#1b1e24" stroke="#3a3e48" stroke-width="1.5"/>
  <!-- Inner cavity -->
  <rect x="18" y="28" width="484" height="134" rx="2" fill="#0d0f12" stroke="#2c3038" stroke-width="1"/>
  <!-- Walls -->
  <rect x="10" y="20" width="500" height="8" fill="#22262e" stroke="#3a3e48" stroke-width="0.5"/><!-- back wall -->
  <rect x="10" y="162" width="500" height="8" fill="#22262e" stroke="#3a3e48" stroke-width="0.5"/><!-- front wall -->
  <rect x="10" y="20" width="8" height="150" fill="#22262e" stroke="#3a3e48" stroke-width="0.5"/><!-- left end -->
  <rect x="502" y="20" width="8" height="150" fill="#22262e" stroke="#3a3e48" stroke-width="0.5"/><!-- right end -->
  <!-- Two top-lid vents (rectangular slots on top surface, near front & back edges) -->
  <g opacity="0.5" stroke="#3a3e48" stroke-width="0.8" fill="none">
    <rect x="100" y="34" width="300" height="3" rx="1.5"/>
    <rect x="100" y="40" width="300" height="3" rx="1.5"/>
    <rect x="100" y="150" width="300" height="3" rx="1.5"/>
    <rect x="100" y="156" width="300" height="3" rx="1.5"/>
  </g>
  <!-- Vapor nozzle row (center line) -->
  <g opacity="0.2">
    <circle cx="80" cy="95" r="3.5" fill="none" stroke="#878c99" stroke-width="0.8"/>
    <circle cx="140" cy="95" r="3.5" fill="none" stroke="#878c99" stroke-width="0.8"/>
    <circle cx="200" cy="95" r="3.5" fill="none" stroke="#878c99" stroke-width="0.8"/>
    <circle cx="260" cy="95" r="3.5" fill="none" stroke="#878c99" stroke-width="0.8"/>
    <circle cx="320" cy="95" r="3.5" fill="none" stroke="#878c99" stroke-width="0.8"/>
    <circle cx="380" cy="95" r="3.5" fill="none" stroke="#878c99" stroke-width="0.8"/>
    <circle cx="440" cy="95" r="3.5" fill="none" stroke="#878c99" stroke-width="0.8"/>
  </g>
  <!-- Control panel — top-right area, recessed panel with 3 buttons -->
  <rect x="410" y="60" width="86" height="38" rx="3" fill="#151719" stroke="#2c3038" stroke-width="1"/>
  <!-- B2 (leftmost) -->
  <circle cx="428" cy="75" r="5" fill="#1b1e24" stroke="#3a3e48" stroke-width="1"/>
  <text x="428" y="87" text-anchor="middle" fill="#878c99" font-size="4" font-family="Inter, sans-serif">B2</text>
  <!-- B1 (center) -->
  <circle cx="452" cy="75" r="5" fill="#1b1e24" stroke="#3a3e48" stroke-width="1"/>
  <text x="452" y="87" text-anchor="middle" fill="#878c99" font-size="4" font-family="Inter, sans-serif">B1</text>
  <!-- On/Off (rightmost, with red LED) -->
  <circle cx="476" cy="75" r="5" fill="#1b1e24" stroke="#3a3e48" stroke-width="1"/>
  <circle cx="476" cy="75" r="1.8" fill="#c0392b" opacity="0.7"/>
  <text x="476" y="87" text-anchor="middle" fill="#878c99" font-size="3.5" font-family="Inter, sans-serif">ON/OFF</text>
  <!-- Fill port — directly to the right of control panel -->
  <circle cx="498" cy="75" r="5" fill="#151719" stroke="#3a3e48" stroke-width="1"/>
  <circle cx="498" cy="75" r="2" fill="#0d0f12" stroke="#2c3038" stroke-width="0.5"/>
  <text x="498" y="87" text-anchor="middle" fill="#878c99" font-size="3.5" font-family="Inter, sans-serif">FILL</text>
  <!-- Label -->
  <text x="260" y="190" text-anchor="middle" fill="#878c99" font-size="8" font-family="Inter, sans-serif">Top View</text>
</svg>
