<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aquafire Hero Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #121417;
      --red: #c0392b;
    }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: #e4e5e9;
      -webkit-font-smoothing: antialiased;
    }
    h1 { font-family: 'Poppins', sans-serif; }

    /* ── Hero Section ── */
    .hero {
      position: relative; overflow: hidden;
      height: 100vh; min-height: 500px;
      display: flex; align-items: center; justify-content: center;
      text-align: center;
      background: #0a0a0a;
    }

    /* Layer 1: Background image */
    .hero-bg {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* Layer 2: Fire video — JS positions this over the firebox */
    .hero-fire {
      position: absolute;
      object-fit: cover;
      z-index: 1;
    }

    /* Layer 3: Gradient overlay */
    .hero-overlay {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(
        180deg,
        rgba(0,0,0,0.35) 0%,
        rgba(0,0,0,0.1) 35%,
        rgba(0,0,0,0.15) 60%,
        rgba(0,0,0,0.5) 85%,
        rgba(18,20,23,1) 100%
      );
      z-index: 2;
      pointer-events: none;
    }

    /* Layer 4: Text content */
    .hero-content {
      position: relative; z-index: 3;
      max-width: 800px; padding: 0 24px;
    }

    .hero h1 {
      font-size: clamp(2.4rem, 5vw, 4rem);
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1.1;
      color: #fff;
      text-shadow: 0 2px 40px rgba(0,0,0,0.5);
    }

    .hero h1 .hero-accent {
      display: block;
      background: linear-gradient(135deg, #fff 0%, var(--red) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-sub {
      color: rgba(228,229,233,0.85);
      margin-top: 20px;
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.6;
      text-shadow: 0 1px 20px rgba(0,0,0,0.6);
      max-width: 540px;
      margin-left: auto; margin-right: auto;
    }

    .hero-scroll-hint {
      position: absolute; bottom: 32px; left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: flex; flex-direction: column; align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.5);
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: hero-bounce 2s ease-in-out infinite;
    }
    .hero-scroll-hint svg { opacity: 0.5; }

    @keyframes hero-bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(6px); }
    }

    /* ── Below-the-fold teaser ── */
    .teaser {
      padding: 80px 24px;
      text-align: center;
      max-width: 640px;
      margin: 0 auto;
    }
    .teaser h2 {
      font-family: 'Poppins', sans-serif;
      font-size: 1.4rem;
      font-weight: 600;
      color: #878c99;
      margin-bottom: 12px;
    }
    .teaser p {
      color: #555a66;
      font-size: 0.95rem;
      line-height: 1.7;
    }

    /* ── Responsive ── */
    @media (max-width: 560px) {
      .hero { height: 85vh; min-height: 400px; }
      .hero-scroll-hint { bottom: 20px; }
    }
  </style>
</head>
<body>

  <header class="hero">
    <!-- Layer 1: Room / fireplace background image -->
    <img class="hero-bg"
      src="https://cdn.shopify.com/s/files/1/0671/5562/4256/files/Untitled_design_-_5.png?v=1774579405"
      alt="" draggable="false">

    <!-- Layer 2: Looping fire video over the firebox opening -->
    <video class="hero-fire" autoplay muted loop playsinline disablepictureinpicture>
      <source src="https://cdn.shopify.com/videos/c/o/v/aec7e11e735c4982b6708c4079829644.mp4" type="video/mp4">
    </video>

    <!-- Layer 3: Dark gradient overlay -->
    <div class="hero-overlay"></div>

    <!-- Layer 4: Text -->
    <div class="hero-content">
      <h1>All Flame.<br><span class="hero-accent">No Fire.</span></h1>
      <p class="hero-sub">Stunningly realistic 3D flames powered by water &mdash; no gas, no venting, no risk.</p>
    </div>

    <div class="hero-scroll-hint" aria-hidden="true">
      <span>Scroll</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m5 12 7 7 7-7"/></svg>
    </div>
  </header>

  <section class="teaser">
    <h2>Hero Preview</h2>
    <p>
      Background image with looping fire video composited over the firebox.
      The video tracks the firebox position responsively via JavaScript.
    </p>
  </section>

  <script>
  // Position the fire video to track the firebox in the background image.
  // Because object-fit:cover crops the image differently at each viewport,
  // we replicate the cover math and map firebox coordinates to screen pixels.
  (function() {
    var img = document.querySelector('.hero-bg');
    var fire = document.querySelector('.hero-fire');
    var hero = document.querySelector('.hero');
    // Firebox inner opening position within the original image (fractions 0-1)
    var F = { l: 0.175, t: 0.25, w: 0.355, h: 0.32 };
    function pos() {
      if (!img.naturalWidth) return;
      var cw = hero.offsetWidth, ch = hero.offsetHeight;
      var iw = img.naturalWidth, ih = img.naturalHeight;
      // Replicate object-fit: cover scaling
      var s = Math.max(cw / iw, ch / ih);
      var rw = iw * s, rh = ih * s;
      var ox = (cw - rw) / 2, oy = (ch - rh) / 2;
      fire.style.left = (ox + F.l * rw) + 'px';
      fire.style.top = (oy + F.t * rh) + 'px';
      fire.style.width = (F.w * rw) + 'px';
      fire.style.height = (F.h * rh) + 'px';
    }
    img.addEventListener('load', pos);
    window.addEventListener('resize', pos);
    if (img.complete) pos();
  })();
  </script>

</body>
</html>
